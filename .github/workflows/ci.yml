name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build & test (with H2 in-memory DB)
        working-directory: FinPort
        run: mvn -B -e -ntp verify
        env:
          SPRING_PROFILES_ACTIVE: test
          DB_URL: jdbc:h2:mem:artha_test;MODE=MySQL;DB_CLOSE_DELAY=-1
          DB_USERNAME: sa
          DB_PASSWORD: ""
          JPA_DDL_AUTO: create-drop

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: FinPort/target/surefire-reports
          if-no-files-found: ignore

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-coverage
          path: FinPort/target/site/jacoco
          if-no-files-found: ignore

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: ./FinPort
          file: ./FinPort/Dockerfile
          push: false
          tags: artha:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max