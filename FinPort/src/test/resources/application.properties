# Test profile — H2 in-memory database, never touches real MySQL
spring.application.name=artha-test

spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.url=jdbc:h2:mem:artha_test;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# OpenAI stubbed in tests — leave empty
openai.api.key=
openai.api.url=https://api.openai.com/v1/chat/completions

# Disable security for slice tests by default; controllers using
# @WithMockUser re-enable it explicitly.
spring.autoconfigure.exclude=