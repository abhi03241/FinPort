# Test profile — H2 in-memory database, never touches real MySQL
spring.application.name=artha-test

# Disable OAuth2 client auto-config in tests (no real Google credentials)
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.oauth2.client.servlet.OAuth2ClientAutoConfiguration

spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.url=jdbc:h2:mem:artha_test;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# OpenAI stubbed in tests — leave empty
openai.api.key=
openai.api.url=https://api.openai.com/v1/chat/completions

# JWT — fixed test secret (32+ bytes)
artha.jwt.secret=test-secret-test-secret-test-secret-test-secret