# =============================================================================
#  Artha — application configuration
#  All sensitive values are read from environment variables.
#  Copy this file to `application-local.properties` (git-ignored) to override
#  values locally without committing secrets.
# =============================================================================

spring.application.name=artha

# --- Server ---
server.port=${SERVER_PORT:8080}

# --- MySQL DataSource (override with env vars: DB_URL, DB_USERNAME, DB_PASSWORD) ---
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/artha_db}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# --- JPA / Hibernate ---
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false

# --- Actuator / Observability ---
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.probes.enabled=true
management.metrics.tags.application=${spring.application.name}

# --- OpenAI (chatbot) — set OPENAI_API_KEY in your environment ---
openai.api.key=${OPENAI_API_KEY:}
openai.api.url=https://api.openai.com/v1/chat/completions

# --- Jackson ---
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.indent-output=false

# --- springdoc / OpenAPI ---
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=alpha
springdoc.show-actuator=false

# --- JWT (Phase 7) ---
# REQUIRED in production: set JWT_SECRET to >= 32 random bytes
artha.jwt.secret=${JWT_SECRET:change-me-change-me-change-me-change-me-change-me}
artha.jwt.access-ttl-minutes=${JWT_ACCESS_TTL_MINUTES:60}
artha.jwt.refresh-ttl-days=${JWT_REFRESH_TTL_DAYS:14}
artha.jwt.issuer=artha

# --- OAuth2 (Phase 7) ---
# Uncomment + fill to enable Google login. Leave commented out to disable.
# spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
# spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
# spring.security.oauth2.client.registration.google.scope=openid,email,profile
artha.oauth2.redirect-base=${OAUTH2_REDIRECT_BASE:http://localhost:5173/oauth/callback}