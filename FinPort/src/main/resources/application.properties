# =============================================================================
#  FinPort — application configuration
#  All sensitive values are read from environment variables.
#  Copy this file to `application-local.properties` (git-ignored) to override
#  values locally without committing secrets.
# =============================================================================

# --- MySQL DataSource (override with env vars: DB_URL, DB_USERNAME, DB_PASSWORD) ---
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/finport_db}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# --- JPA / Hibernate ---
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update

# --- OpenAI (chatbot) — set OPENAI_API_KEY in your environment ---
openai.api.key=${OPENAI_API_KEY:}
openai.api.url=https://api.openai.com/v1/chat/completions
