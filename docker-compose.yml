services:
  mysql:
    image: mysql:8.0
    container_name: artha-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-artha_db}
      MYSQL_USER: ${MYSQL_USER:-artha}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-arthapassword}
    ports:
      - "3307:3306"
    volumes:
      - artha_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-rootpassword}"]
      interval: 10s
      timeout: 5s
      retries: 10

  artha:
    build:
      context: ./FinPort
      dockerfile: Dockerfile
    image: artha:latest
    container_name: artha-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-artha_db}
      DB_USERNAME: ${MYSQL_USER:-artha}
      DB_PASSWORD: ${MYSQL_PASSWORD:-arthapassword}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      SERVER_PORT: 8080
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health/liveness || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  artha_mysql_data: